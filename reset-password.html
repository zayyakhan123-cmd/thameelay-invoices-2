<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Set new password — Track Aisle</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','-apple-system','sans-serif'] },
          colors: { ink: { 900:'#0a0e1a' } }
        }
      }
    }
  </script>
  <style>
    *,::before,::after{box-sizing:border-box}
    body{background:#0a0e1a;color:#f1f5f9;font-family:'Inter',sans-serif;min-height:100vh}
    .logo-dot{background:radial-gradient(circle at 30% 30%,#67e8f9,#0891b2)}
    .btn-cyan{background:linear-gradient(135deg,#22d3ee,#0891b2);color:#0a0e1a;font-weight:600}
    .btn-cyan:hover{opacity:.9}
    .btn-cyan:disabled{opacity:.5;cursor:not-allowed}
    .auth-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:11px 14px;font-size:14px;color:#f1f5f9;outline:none;transition:border-color .15s}
    .auth-input::placeholder{color:#64748b}
    .auth-input:focus{border-color:rgba(34,211,238,.5);background:rgba(255,255,255,0.06)}
    .auth-input.error{border-color:rgba(239,68,68,.5)}
    .auth-card{background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:36px 32px}
    .form-msg{font-size:13px;padding:10px 14px;border-radius:8px;display:none}
    .form-msg.err{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.2);display:block}
    .form-msg.ok{background:rgba(34,211,238,.08);color:#67e8f9;border:1px solid rgba(34,211,238,.2);display:block}
    .pw-bar-wrap{height:4px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:8px;overflow:hidden}
    .pw-bar{height:100%;border-radius:2px;transition:width .3s,background .3s;width:0}
    .invalid-state{display:none;text-align:center;padding:24px 0}
    .invalid-state.show{display:block}
  </style>
</head>
<body>

<!-- Nav -->
<header class="flex items-center justify-between px-5 py-4 sm:px-10">
  <a href="/" class="flex items-center gap-2.5">
    <span class="logo-dot inline-block h-2.5 w-2.5 rounded-full"></span>
    <span class="text-[15px] font-semibold tracking-tight text-white">Track Aisle</span>
  </a>
</header>

<!-- Main -->
<main class="mx-auto max-w-sm px-5 py-10 sm:py-16">

  <!-- Invalid link state -->
  <div class="invalid-state" id="invalid-state">
    <div class="auth-card text-center">
      <p class="text-[14px] text-slate-400 mb-4">This reset link is invalid or has expired.</p>
      <a href="/forgot-password" class="btn-cyan inline-block rounded-xl px-5 py-3 text-[14px] transition">
        Request a new link
      </a>
    </div>
  </div>

  <!-- Form -->
  <div id="form-wrap">
    <div class="auth-card">
      <h1 class="text-[22px] font-bold text-white mb-1">Set a new password</h1>
      <p class="text-[14px] text-slate-400 mb-7">Choose a strong password for your account.</p>

      <div class="form-msg" id="form-msg"></div>

      <form id="reset-form" novalidate>
        <div class="mb-3">
          <input class="auth-input" id="password" type="password" placeholder="New password" autocomplete="new-password" oninput="onPwInput(this.value)" />
          <div class="pw-bar-wrap mt-2"><div class="pw-bar" id="pw-bar"></div></div>
          <div class="flex mt-1"><span class="text-[11px] text-slate-500" id="pw-label"></span></div>
        </div>
        <div class="mb-5">
          <input class="auth-input" id="confirm-password" type="password" placeholder="Confirm new password" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn-cyan w-full rounded-xl px-5 py-3 text-[14px] transition" id="submit-btn">
          Update password
        </button>
      </form>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL      = 'https://fslrqqaplwfyqemdumfz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4BasD3CNBDNtDOQfSzKLeA_8L41PxHR';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Exchange the code from the email link
(async () => {
  const params = new URLSearchParams(location.search);
  const code   = params.get('code');

  if(code){
    const { error } = await sb.auth.exchangeCodeForSession(code);
    if(error){
      document.getElementById('form-wrap').style.display    = 'none';
      document.getElementById('invalid-state').classList.add('show');
    }
    // Clean the URL
    history.replaceState({}, '', location.pathname);
    return;
  }

  // No code → check for hash-based token (implicit flow fallback)
  const hash = new URLSearchParams(location.hash.slice(1));
  if(!hash.get('access_token')){
    document.getElementById('form-wrap').style.display    = 'none';
    document.getElementById('invalid-state').classList.add('show');
  }
})();

function onPwInput(val){
  const bar = document.getElementById('pw-bar');
  const lbl = document.getElementById('pw-label');
  let score = 0;
  if(val.length >= 8)  score++;
  if(val.length >= 12) score++;
  if(/[A-Z]/.test(val)) score++;
  if(/[0-9]/.test(val)) score++;
  if(/[^A-Za-z0-9]/.test(val)) score++;
  const levels = [
    { w:'0%',   bg:'transparent',  txt:'' },
    { w:'20%',  bg:'#f87171',      txt:'Very weak' },
    { w:'40%',  bg:'#fb923c',      txt:'Weak' },
    { w:'60%',  bg:'#fbbf24',      txt:'Fair' },
    { w:'80%',  bg:'#34d399',      txt:'Strong' },
    { w:'100%', bg:'#22d3ee',      txt:'Very strong' },
  ];
  const lvl = levels[score];
  bar.style.width      = lvl.w;
  bar.style.background = lvl.bg;
  lbl.textContent      = lvl.txt;
}

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw      = document.getElementById('password').value;
  const confirm = document.getElementById('confirm-password').value;
  const btn     = document.getElementById('submit-btn');
  const msg     = document.getElementById('form-msg');

  msg.className = 'form-msg'; msg.textContent = '';

  if(pw.length < 8){
    msg.textContent = 'Password must be at least 8 characters.';
    msg.classList.add('err'); return;
  }
  if(pw !== confirm){
    msg.textContent = 'Passwords do not match.';
    msg.classList.add('err'); return;
  }

  btn.disabled = true; btn.textContent = 'Updating…';

  const { error } = await sb.auth.updateUser({ password: pw });

  if(error){
    msg.textContent = error.message;
    msg.classList.add('err');
    btn.disabled = false; btn.textContent = 'Update password';
    return;
  }

  // Sign out and send to app login gate with success message
  await sb.auth.signOut();
  window.location.href = '/app?reset=1';
});
</script>
</body>
</html>
