<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sign in — Track Aisle</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','-apple-system','sans-serif'] },
          colors: { ink: { 950:'#070a13', 900:'#0a0e1a', 800:'#0f1424', 700:'#171c30' } }
        }
      }
    }
  </script>
  <style>
    *,::before,::after{box-sizing:border-box}
    body{background:#0a0e1a;color:#f1f5f9;font-family:'Inter',sans-serif;min-height:100vh}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(34,211,238,.07) 0%,transparent 70%);pointer-events:none;z-index:0}
    .logo-dot{background:radial-gradient(circle at 30% 30%,#67e8f9,#0891b2)}
    .btn-cyan{background:linear-gradient(180deg,#22d3ee 0%,#06b6d4 100%);color:#042630;font-weight:700;letter-spacing:-.01em;box-shadow:0 0 20px -4px rgba(34,211,238,.35),inset 0 1px 0 rgba(255,255,255,.2);transition:filter .15s,transform .15s,box-shadow .15s}
    .btn-cyan:hover{filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 0 28px -4px rgba(34,211,238,.45),inset 0 1px 0 rgba(255,255,255,.2)}
    .btn-cyan:active{transform:translateY(0)}
    .btn-cyan:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none}
    .auth-input{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.13);border-radius:10px;padding:12px 14px;font-size:14px;color:#f1f5f9;outline:none;transition:border-color .15s,background .15s,box-shadow .15s}
    .auth-input::placeholder{color:#4e596b}
    .auth-input:focus{border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.04);box-shadow:0 0 0 3px rgba(34,211,238,.08)}
    .auth-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:36px 32px;box-shadow:0 24px 64px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,0.03) inset;position:relative;z-index:1}
    .auth-card::before{content:'';position:absolute;inset:0;border-radius:20px;background:linear-gradient(135deg,rgba(34,211,238,.04) 0%,transparent 60%);pointer-events:none}
    .form-msg{font-size:13px;padding:10px 14px;border-radius:8px;display:none}
    .form-msg.err{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.2);display:block}
    .form-msg.ok{background:rgba(34,211,238,.08);color:#67e8f9;border:1px solid rgba(34,211,238,.2);display:block}
    .forgot-link{display:block;text-align:right;font-size:12px;color:#64748b;margin-top:6px;transition:color .15s}
    .forgot-link:hover{color:#22d3ee}
  </style>
</head>
<body>

<!-- Nav -->
<header class="flex items-center justify-between px-5 py-4 sm:px-10">
  <a href="/" class="flex items-center gap-2.5">
    <span class="logo-dot inline-block h-2.5 w-2.5 rounded-full"></span>
    <span class="text-[15px] font-semibold tracking-tight text-white">Track Aisle</span>
  </a>
  <a href="/signup" class="text-[13.5px] font-medium text-slate-300 hover:text-white transition-colors">Get started</a>
</header>

<!-- Main -->
<main class="mx-auto max-w-md px-5 py-10 sm:py-16">
  <div class="auth-card">
    <h1 class="text-[22px] font-bold text-white mb-1">Welcome back</h1>
    <p class="text-[14px] text-slate-400 mb-7">Sign in to your Track Aisle account.</p>

    <div class="form-msg" id="form-msg"></div>

    <form id="signin-form" novalidate class="mt-1">
      <div class="mb-3">
        <input class="auth-input" id="email" type="email" placeholder="Email address" autocomplete="email" />
      </div>
      <div class="mb-1">
        <input class="auth-input" id="password" type="password" placeholder="Password" autocomplete="current-password" />
        <a href="/forgot-password" class="forgot-link">Forgot password?</a>
      </div>
      <div class="mb-5"></div>
      <button type="submit" class="btn-cyan w-full rounded-xl px-5 py-3 text-[14px] transition" id="submit-btn">
        Sign in
      </button>
    </form>
  </div>

  <p class="text-center mt-5 text-[13.5px] text-slate-400">
    Don't have an account?
    <a href="/#pricing" class="text-cyan-300 hover:text-cyan-200 font-medium">Get started</a>
  </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL      = 'https://fslrqqaplwfyqemdumfz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4BasD3CNBDNtDOQfSzKLeA_8L41PxHR';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Show success message when redirected from reset-password
if(new URLSearchParams(location.search).get('reset') === '1'){
  const msg = document.getElementById('form-msg');
  msg.textContent = 'Password updated. Please sign in with your new password.';
  msg.classList.add('ok');
  history.replaceState({}, '', location.pathname);
}

document.getElementById('signin-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('submit-btn');
  const msg      = document.getElementById('form-msg');

  msg.className = 'form-msg'; msg.textContent = '';

  if(!email || !password){
    msg.textContent = 'Please enter your email and password.';
    msg.classList.add('err');
    return;
  }

  btn.disabled = true; btn.textContent = 'Signing in…';

  const { error } = await sb.auth.signInWithPassword({ email, password });

  if(error){
    msg.textContent = error.message === 'Invalid login credentials'
      ? 'Incorrect email or password.'
      : error.message;
    msg.classList.add('err');
    btn.disabled = false; btn.textContent = 'Sign in';
    return;
  }

  // Check for ?next= redirect param
  const next = new URLSearchParams(location.search).get('next') || '/app';
  window.location.href = next;
});
</script>
</body>
</html>
