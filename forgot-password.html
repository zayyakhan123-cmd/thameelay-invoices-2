<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Forgot password — Track Aisle</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','-apple-system','sans-serif'] },
          colors: { ink: { 900:'#0a0e1a' } }
        }
      }
    }
  </script>
  <style>
    *,::before,::after{box-sizing:border-box}
    body{background:#0a0e1a;color:#f1f5f9;font-family:'Inter',sans-serif;min-height:100vh}
    .logo-dot{background:radial-gradient(circle at 30% 30%,#67e8f9,#0891b2)}
    .btn-cyan{background:linear-gradient(135deg,#22d3ee,#0891b2);color:#0a0e1a;font-weight:600}
    .btn-cyan:hover{opacity:.9}
    .btn-cyan:disabled{opacity:.5;cursor:not-allowed}
    .auth-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:11px 14px;font-size:14px;color:#f1f5f9;outline:none;transition:border-color .15s}
    .auth-input::placeholder{color:#64748b}
    .auth-input:focus{border-color:rgba(34,211,238,.5);background:rgba(255,255,255,0.06)}
    .auth-card{background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:36px 32px}
    .form-msg{font-size:13px;padding:10px 14px;border-radius:8px;display:none}
    .form-msg.err{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.2);display:block}
    .form-msg.ok{background:rgba(34,211,238,.08);color:#67e8f9;border:1px solid rgba(34,211,238,.2);display:block}
  </style>
</head>
<body>

<!-- Nav -->
<header class="flex items-center justify-between px-5 py-4 sm:px-10">
  <a href="/" class="flex items-center gap-2.5">
    <span class="logo-dot inline-block h-2.5 w-2.5 rounded-full"></span>
    <span class="text-[15px] font-semibold tracking-tight text-white">Track Aisle</span>
  </a>
  <a href="/signin" class="text-[13.5px] font-medium text-slate-300 hover:text-white transition-colors">Sign in</a>
</header>

<!-- Main -->
<main class="mx-auto max-w-sm px-5 py-10 sm:py-16">
  <div class="auth-card">
    <h1 class="text-[22px] font-bold text-white mb-1">Reset your password</h1>
    <p class="text-[14px] text-slate-400 mb-7">Enter your email and we'll send a reset link.</p>

    <div class="form-msg" id="form-msg"></div>

    <form id="forgot-form" novalidate>
      <div class="mb-4">
        <input class="auth-input" id="email" type="email" placeholder="Email" autocomplete="email" />
      </div>
      <button type="submit" class="btn-cyan w-full rounded-xl px-5 py-3 text-[14px] transition" id="submit-btn">
        Send reset link
      </button>
    </form>
  </div>

  <p class="text-center mt-5 text-[13.5px] text-slate-400">
    Remembered it? <a href="/signin" class="text-cyan-300 hover:text-cyan-200 font-medium">Sign in</a>
  </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL      = 'https://fslrqqaplwfyqemdumfz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4BasD3CNBDNtDOQfSzKLeA_8L41PxHR';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

document.getElementById('forgot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const btn   = document.getElementById('submit-btn');
  const msg   = document.getElementById('form-msg');

  msg.className = 'form-msg'; msg.textContent = '';

  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    msg.textContent = 'Enter a valid email address.';
    msg.classList.add('err');
    return;
  }

  btn.disabled = true; btn.textContent = 'Sending…';

  await sb.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://trackaisle.com/reset-password',
  });

  // Always show success — don't leak whether email exists
  msg.textContent = "If an account exists for this email, we've sent a reset link.";
  msg.classList.add('ok');
  document.getElementById('forgot-form').style.display = 'none';
  btn.disabled = false;
});
</script>
</body>
</html>
